<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UML Viewer</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='4' width='24' height='24' rx='4' fill='%233b82c4'/%3E%3Cpath d='M9 11h14M9 16h14M9 21h9' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <svg width="18" height="18" viewBox="0 0 32 32" aria-hidden="true">
            <rect x="4" y="4" width="24" height="24" rx="4" fill="currentColor" />
            <path d="M9 11h14M9 16h14M9 21h9" stroke="var(--panel)" stroke-width="2.5" stroke-linecap="round" />
          </svg>
          <span>UML Viewer</span>
        </div>

        <label class="field">
          <span class="field-label">Example</span>
          <select id="examples"></select>
        </label>

        <div class="spacer"></div>

        <div class="segmented" id="renderer-seg" role="radiogroup" aria-label="Renderer">
          <button type="button" data-value="auto">Auto</button>
          <button type="button" data-value="native">Native</button>
          <button type="button" data-value="server">Server</button>
        </div>

        <div class="toolbar-group">
          <button type="button" id="btn-zoom-out" class="icon-btn" title="Zoom out">−</button>
          <button type="button" id="btn-zoom-reset" class="zoom-label" title="Reset zoom">100%</button>
          <button type="button" id="btn-zoom-in" class="icon-btn" title="Zoom in">+</button>
          <button type="button" id="btn-fit" title="Fit diagram to view">Fit</button>
        </div>

        <div class="toolbar-group">
          <button type="button" id="btn-export-svg" title="Download as SVG">SVG</button>
          <button type="button" id="btn-export-png" title="Download as PNG">PNG</button>
          <button type="button" id="btn-copy-link" title="Copy a shareable link">Link</button>
        </div>

        <button type="button" id="btn-settings" class="primary" aria-expanded="false" aria-controls="settings-panel">Settings</button>
      </header>

      <main class="split" id="split">
        <section id="editor-pane" aria-label="PlantUML source"></section>
        <div id="divider" role="separator" aria-orientation="vertical" title="Drag to resize"></div>
        <section id="diagram-pane" aria-label="Diagram">
          <div id="canvas">
            <div id="viewport"></div>
          </div>
          <div id="diagram-message" hidden></div>
          <div id="legend" class="legend" hidden></div>
          <button type="button" id="btn-legend" class="legend-toggle" title="Show legend" aria-pressed="false">?</button>
        </section>
      </main>

      <footer class="statusbar">
        <span id="status-mode"></span>
        <span id="status-stats"></span>
        <span class="spacer"></span>
        <button type="button" id="status-warnings" class="status-warnings" hidden></button>
      </footer>

      <div id="warnings-list" class="warnings-list" hidden></div>

      <aside id="settings-panel" class="settings-panel" hidden aria-label="Settings">
        <div class="settings-header">
          <strong>Settings</strong>
          <button type="button" id="btn-settings-close" class="icon-btn" title="Close">×</button>
        </div>
        <div id="settings-body" class="settings-body"></div>
        <div class="settings-footer">
          <button type="button" id="btn-settings-reset">Reset to defaults</button>
        </div>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
